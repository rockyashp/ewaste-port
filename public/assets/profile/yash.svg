<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff" />
      <stop offset="50%" stop-color="#d1fae5" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background circle with soft gradient -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" />

  <!-- Circuit board background traces -->
  <g stroke="url(#circuitGrad)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 100 150 L 180 150 L 220 190" />
    <path d="M 400 150 L 320 150 L 280 190" />
    <path d="M 80 300 L 150 300 L 180 330" />
    <path d="M 420 300 L 350 300 L 320 330" />
    <circle cx="100" cy="150" r="6" fill="#10b981" />
    <circle cx="400" cy="150" r="6" fill="#10b981" />
    <circle cx="80" cy="300" r="6" fill="#3b82f6" />
    <circle cx="420" cy="300" r="6" fill="#3b82f6" />
  </g>

  <!-- Head / Face silhouette or Avatar -->
  <!-- Base torso -->
  <path d="M 150 420 C 150 350, 350 350, 350 420 C 350 450, 150 450, 150 420 Z" fill="url(#avatarGrad)" />
  
  <!-- Neck -->
  <rect x="230" y="270" width="40" height="60" rx="10" fill="#f0fdf4" stroke="#0f766e" stroke-width="3" />

  <!-- Face -->
  <circle cx="250" cy="230" r="70" fill="#f0fdf4" stroke="#0f766e" stroke-width="4" />

  <!-- Hair / Tech Cap -->
  <path d="M 180 230 C 180 150, 320 150, 320 230 C 300 210, 200 210, 180 230 Z" fill="#0f766e" />

  <!-- Glasses -->
  <g stroke="#0f766e" stroke-width="3" fill="none">
    <circle cx="225" cy="230" r="18" fill="rgba(167, 243, 208, 0.4)" />
    <circle cx="275" cy="230" r="18" fill="rgba(167, 243, 208, 0.4)" />
    <line x1="243" y1="230" x2="257" y2="230" />
    <line x1="207" y1="230" x2="197" y2="225" />
    <line x1="293" y1="230" x2="303" y2="225" />
  </g>

  <!-- Smile -->
  <path d="M 235 265 Q 250 275, 265 265" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Creative details: floating leaf and tech gear -->
  <!-- Leaf -->
  <g transform="translate(140, 100) scale(0.7)">
    <path d="M 30 10 C 10 30, 10 60, 40 70 C 70 60, 70 30, 50 10 Z" fill="#22c55e" />
    <path d="M 30 10 L 40 70" stroke="#f0fdf4" stroke-width="2" />
  </g>

  <!-- Small Gear -->
  <g transform="translate(320, 80) scale(0.6)" fill="#0d9488">
    <circle cx="50" cy="50" r="15" />
    <path d="M 50 10 L 50 90 M 10 50 L 90 50 M 22 22 L 78 78 M 22 78 L 78 22" stroke="#0d9488" stroke-width="10" stroke-linecap="round" />
    <circle cx="50" cy="50" r="25" fill="none" stroke="#0d9488" stroke-width="8" />
    <circle cx="50" cy="50" r="8" fill="#ecfeff" />
  </g>

  <!-- Label text in SVG -->
  <rect x="180" y="440" width="140" height="30" rx="15" fill="#0f766e" />
  <text x="250" y="460" font-family="Outfit, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">YASH PATIL</text>

</svg>
