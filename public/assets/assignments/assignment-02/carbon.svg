<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="barYash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="barIndia" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="barWorld" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Content Card -->
  <rect x="50" y="50" width="700" height="500" fill="#ffffff" rx="16" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.35))" />
  
  <text x="400" y="100" font-family="'Outfit', sans-serif" font-size="26" font-weight="900" fill="#0f172a" text-anchor="middle">Household Carbon Footprint Comparison</text>
  <text x="400" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Annual Emissions Profile (Tonnes of CO₂ per Year)</text>
  
  <!-- Graph Frame -->
  <line x1="180" y1="440" x2="680" y2="440" stroke="#cbd5e1" stroke-width="2" />
  <line x1="180" y1="180" x2="180" y2="440" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Grid Lines -->
  <line x1="305" y1="180" x2="305" y2="440" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="5,5" />
  <line x1="430" y1="180" x2="430" y2="440" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="5,5" />
  <line x1="555" y1="180" x2="555" y2="440" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="5,5" />
  <line x1="680" y1="180" x2="680" y2="440" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="5,5" />
  
  <!-- Axis Labels -->
  <text x="180" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">0.0 t</text>
  <text x="305" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">5.0 t</text>
  <text x="430" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">10.0 t</text>
  <text x="555" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">15.0 t</text>
  <text x="680" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">20.0 t</text>
  
  <!-- Row 1: India Average -->
  <text x="70" y="240" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" fill="#0f172a">India Average</text>
  <text x="70" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Regional Standard</text>
  <rect x="180" y="215" width="173" height="40" fill="url(#barIndia)" rx="6" />
  <text x="365" y="240" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#059669">6.92 t</text>
  
  <!-- Row 2: My Household -->
  <text x="70" y="325" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" fill="#0f172a">My Household</text>
  <text x="70" y="343" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Yash's Carbon Footprint</text>
  <rect x="180" y="300" width="335" height="40" fill="url(#barYash)" rx="6" />
  <text x="525" y="325" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#d97706">13.40 t</text>
  
  <!-- Row 3: World Average -->
  <text x="70" y="410" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" fill="#0f172a">World Average</text>
  <text x="70" y="428" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Global Standard</text>
  <rect x="180" y="385" width="467" height="40" fill="url(#barWorld)" rx="6" />
  <text x="660" y="410" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#dc2626">18.68 t</text>

  <!-- Footnote -->
  <text x="400" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-style="italic" fill="#94a3b8" text-anchor="middle">Calculated using Household Footprint metrics based on energy bills, fuel use, and waste streams.</text>
</svg>
