<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- Outer Window Frame -->
  <rect width="1000" height="600" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Title bar -->
  <path d="M 0 12 Q 0 0 12 0 H 988 Q 1000 0 1000 12 V 50 H 0 Z" fill="#e2e8f0" />
  <circle cx="20" cy="25" r="6" fill="#ef4444" />
  <circle cx="40" cy="25" r="6" fill="#f59e0b" />
  <circle cx="60" cy="25" r="6" fill="#10b981" />
  <text x="500" y="32" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" fill="#475569" text-anchor="middle">EcoSort Dashboard - Yash Patil</text>

  <!-- Sidebar -->
  <rect x="0" y="50" width="200" height="550" fill="#ffffff" stroke-right="#e2e8f0" stroke-width="1" />
  <g transform="translate(20, 80)">
    <!-- Logo -->
    <text x="0" y="20" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#10b981">☘ EcoSort AI</text>
    
    <!-- Menu items -->
    <rect x="-10" y="50" width="180" height="35" rx="6" fill="#ecfeff" />
    <text x="10" y="73" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#0e7490">📊 Real-time Feed</text>
    
    <text x="10" y="123" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b">⚙ Classification Config</text>
    <text x="10" y="173" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b">📈 Analytics Reports</text>
    <text x="10" y="223" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b">♻ Recycling Partners</text>
    <text x="10" y="273" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b">ℹ System Diagnostics</text>
  </g>

  <!-- Main Content Grid -->
  <!-- Stats Row -->
  <g transform="translate(220, 70)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="230" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">ITEMS SORTED TODAY</text>
    <text x="20" y="70" font-family="'Outfit', sans-serif" font-size="32" font-weight="bold" fill="#0f766e">1,248 units</text>
    <rect x="180" y="20" width="30" height="30" rx="6" fill="#f0fdf4" />
    <path d="M 187 40 L 195 28 L 203 40" stroke="#10b981" stroke-width="2" fill="none" />

    <!-- Card 2 -->
    <rect x="250" y="0" width="230" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="270" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">RECYCLING EFFICIENCY</text>
    <text x="270" y="70" font-family="'Outfit', sans-serif" font-size="32" font-weight="bold" fill="#0284c7">94.8 %</text>
    <rect x="430" y="20" width="30" height="30" rx="6" fill="#f0f9ff" />
    <circle cx="445" cy="35" r="8" stroke="#0ea5e9" stroke-width="2" fill="none" />

    <!-- Card 3 -->
    <rect x="500" y="0" width="240" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="520" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">ESTIMATED RECOVERY VALUE</text>
    <text x="520" y="70" font-family="'Outfit', sans-serif" font-size="32" font-weight="bold" fill="#10b981">$3,412.50</text>
  </g>

  <!-- Visualized Graph / Chart Area -->
  <g transform="translate(220, 190)">
    <rect x="0" y="0" width="480" height="230" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="30" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" fill="#334155">Weekly Sorting Breakdown (by type)</text>
    
    <!-- Bar charts -->
    <g transform="translate(40, 190)" stroke-width="20" stroke-linecap="round">
      <!-- Mon -->
      <line x1="20" y1="0" x2="20" y2="-80" stroke="#f43f5e" />
      <line x1="20" y1="-80" x2="20" y2="-120" stroke="#10b981" />
      <text x="20" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Mon</text>
      
      <!-- Tue -->
      <line x1="90" y1="0" x2="90" y2="-60" stroke="#f43f5e" />
      <line x1="90" y1="-60" x2="90" y2="-150" stroke="#10b981" />
      <text x="90" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Tue</text>

      <!-- Wed -->
      <line x1="160" y1="0" x2="160" y2="-110" stroke="#f43f5e" />
      <line x1="160" y1="-110" x2="160" y2="-170" stroke="#10b981" />
      <text x="160" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Wed</text>

      <!-- Thu -->
      <line x1="230" y1="0" x2="230" y2="-40" stroke="#f43f5e" />
      <line x1="230" y1="-40" x2="230" y2="-110" stroke="#10b981" />
      <text x="230" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Thu</text>

      <!-- Fri -->
      <line x1="300" y1="0" x2="300" y2="-90" stroke="#f43f5e" />
      <line x1="300" y1="-90" x2="300" y2="-140" stroke="#10b981" />
      <text x="300" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fri</text>

      <!-- Sat -->
      <line x1="370" y1="0" x2="370" y2="-30" stroke="#f43f5e" />
      <line x1="370" y1="-30" x2="370" y2="-60" stroke="#10b981" />
      <text x="370" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Sat</text>
    </g>

    <!-- Legend -->
    <rect x="360" y="15" width="10" height="10" fill="#f43f5e" />
    <text x="375" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">Silicon boards</text>
    <rect x="360" y="35" width="10" height="10" fill="#10b981" />
    <text x="375" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">Plastics &amp; Glass</text>
  </g>

  <!-- Live Feed / Camera Detection box -->
  <g transform="translate(715, 190)">
    <rect x="0" y="0" width="245" height="230" rx="8" fill="#1e293b" />
    <text x="15" y="25" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">📹 LIVE AI SORTING FEED</text>
    
    <!-- Mock camera view -->
    <rect x="15" y="45" width="215" height="140" rx="6" fill="#334155" />
    <circle cx="120" cy="115" r="30" fill="none" stroke="#22c55e" stroke-width="2" />
    <!-- Green bounding box -->
    <rect x="70" y="65" width="100" height="100" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,4" />
    <text x="75" y="80" font-family="monospace" font-size="10" font-weight="bold" fill="#22c55e">SMARTPHONE [98% CONF]</text>
    
    <!-- Feed status -->
    <circle cx="25" cy="205" r="4" fill="#ef4444" />
    <text x="35" y="209" font-family="monospace" font-size="10" fill="#94a3b8">CAMERA_01 // DETECTING...</text>
  </g>

  <!-- Bottom Log / Table Area -->
  <g transform="translate(220, 435)">
    <rect x="0" y="0" width="740" height="145" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="25" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#334155">Recent Classifications Log</text>
    
    <!-- Log Header -->
    <text x="20" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#475569">TIMESTAMP</text>
    <text x="180" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#475569">ITEM TYPE</text>
    <text x="360" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#475569">COMPOSITION</text>
    <text x="540" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#475569">CONFIDENCE</text>
    <text x="640" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#475569">DESTINATION</text>
    <line x1="20" y1="65" x2="720" y2="65" stroke="#f1f5f9" stroke-width="1" />

    <!-- Log Row 1 -->
    <text x="20" y="85" font-family="monospace" font-size="11" fill="#64748b">19:22:45</text>
    <text x="180" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#334155">Apple iPhone X</text>
    <text x="360" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Lithium, Copper, Gold</text>
    <text x="540" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#10b981">98.4 %</text>
    <text x="640" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#0369a1">Metal Recovery</text>

    <!-- Log Row 2 -->
    <text x="20" y="115" font-family="monospace" font-size="11" fill="#64748b">19:21:02</text>
    <text x="180" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#334155">Dell Motherboard</text>
    <text x="360" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Silicon, Lead, Copper</text>
    <text x="540" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#10b981">96.7 %</text>
    <text x="640" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#0f766e">PCB Shredder</text>
  </g>
</svg>
