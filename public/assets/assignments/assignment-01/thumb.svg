  <path d="M 50 50 L 150 50 L 200 100 L 350 100" stroke="#a7f3d0" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M 50 200 L 250 200 L 300 150 L 350 150" stroke="#a7f3d0" stroke-width="4" fill="none" stroke-linecap="round" />
  <circle cx="150" cy="50" r="8" fill="#10b981" />
  <circle cx="250" cy="200" r="8" fill="#10b981" />
  <!-- Text icon -->
  <rect x="130" y="75" width="140" height="100" rx="10" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))" stroke="#e2e8f0" stroke-width="1" />
  <text x="200" y="115" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold" fill="#0f766e" text-anchor="middle">REPORT</text>
  <text x="200" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#0ea5e9" text-anchor="middle">PDF DOCUMENT</text>
