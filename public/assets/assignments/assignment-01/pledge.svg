<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Subtle circular grid line -->
  <circle cx="400" cy="300" r="280" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.15" stroke-dasharray="10,5" />
  
  <!-- Certificate Border Card -->
  <rect x="50" y="50" width="700" height="500" fill="url(#cardGrad)" rx="16" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.35))" />
  <rect x="65" y="65" width="670" height="470" fill="none" stroke="#0d9488" stroke-width="2" rx="10" opacity="0.6" />
  
  <!-- Corner Tech Details -->
  <path d="M 80 100 L 100 100 L 100 80" stroke="#0d9488" stroke-width="3" fill="none" />
  <path d="M 720 100 L 700 100 L 700 80" stroke="#0d9488" stroke-width="3" fill="none" />
  <path d="M 80 500 L 100 500 L 100 520" stroke="#0d9488" stroke-width="3" fill="none" />
  <path d="M 720 500 L 700 500 L 700 520" stroke="#0d9488" stroke-width="3" fill="none" />

  <!-- Header -->
  <text x="400" y="140" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#0d9488" text-anchor="middle" letter-spacing="4">SUSTAINABLE COMPUTER ENGINEERING</text>
  <text x="400" y="180" font-family="'Outfit', sans-serif" font-size="36" font-weight="900" fill="#0f172a" text-anchor="middle">Pledge of Responsibility</text>
  <line x1="300" y1="210" x2="500" y2="210" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" />

  <!-- Body Content -->
  <text x="400" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#475569" text-anchor="middle">This document certifies that</text>
  <text x="400" y="320" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold" fill="#0f766e" text-anchor="middle">Yash Patil</text>
  <text x="400" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#475569" text-anchor="middle">has pledged a personal commitment to a sustainable environmental future by</text>
  <text x="400" y="390" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="bold" fill="#0369a1" text-anchor="middle">disposing of e-waste responsibly, using technology wisely, and conserving energy.</text>

  <!-- Checked Badge -->
  <g transform="translate(400, 460)">
    <circle cx="0" cy="0" r="30" fill="#f0fdf4" stroke="#10b981" stroke-width="2" />
    <path d="M -12 0 L -3 9 L 12 -8" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Submit Date -->
  <text x="100" y="500" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">SUBMITTED: 2026-07-29</text>
  <text x="700" y="500" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="end">WEEK 01 ACTIVITY</text>
</svg>
