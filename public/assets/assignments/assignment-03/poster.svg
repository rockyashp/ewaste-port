<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="1100" fill="#f0fdf4" rx="20" />
  <rect x="20" y="20" width="760" height="1060" fill="none" stroke="#10b981" stroke-width="4" rx="15" />
  
  <!-- Circuit Background Pattern -->
  <g opacity="0.08" stroke="#10b981" stroke-width="2" fill="none">
    <path d="M 50 100 L 150 100 L 200 150 L 200 300" />
    <path d="M 750 100 L 650 100 L 600 150 L 600 300" />
    <path d="M 50 1000 L 150 1000 L 200 950 L 200 800" />
    <path d="M 750 1000 L 650 1000 L 600 950 L 600 800" />
    <circle cx="200" cy="300" r="8" fill="#10b981" />
    <circle cx="600" cy="300" r="8" fill="#10b981" />
    <circle cx="200" cy="800" r="8" fill="#10b981" />
    <circle cx="600" cy="800" r="8" fill="#10b981" />
  </g>

  <!-- Header -->
  <text x="400" y="100" font-family="'Outfit', sans-serif" font-size="44" font-weight="900" fill="#0f766e" text-anchor="middle" letter-spacing="2">E-WASTE PORTFOLIO</text>
  <text x="400" y="150" font-family="'Outfit', sans-serif" font-size="24" font-weight="600" fill="#0284c7" text-anchor="middle">THE CIRCULAR ECONOMY MODEL</text>
  <line x1="150" y1="180" x2="650" y2="180" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

  <!-- Center Graphic: Circular Loop of Electronics -->
  <g transform="translate(400, 480)">
    <!-- Circular Arrow 1 -->
    <path d="M -150 0 A 150 150 0 0 1 120 -90" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)" />
    <!-- Circular Arrow 2 -->
    <path d="M 150 0 A 150 150 0 0 1 -120 90" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" />

    <!-- Center text -->
    <circle cx="0" cy="0" r="100" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.05))" />
    <text x="0" y="-10" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#0f766e" text-anchor="middle">RECYCLE</text>
    <text x="0" y="20" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#0ea5e9" text-anchor="middle">REUSE</text>
    <text x="0" y="50" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#22c55e" text-anchor="middle">RECOVER</text>

    <!-- Node 1: Smart Device -->
    <g transform="translate(0, -180)">
      <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="3" />
      <rect x="-30" y="-20" width="60" height="40" rx="3" fill="#e0f2fe" />
      <circle cx="0" cy="15" r="3" fill="#0ea5e9" />
      <text x="0" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">1. Consumption</text>
    </g>

    <!-- Node 2: E-waste collection -->
    <g transform="translate(180, 50)">
      <circle cx="0" cy="0" r="40" fill="#ffffff" stroke="#10b981" stroke-width="3" />
      <!-- Recycle Bin shape -->
      <path d="M -15 -15 H 15 L 12 20 H -12 Z M -18 -15 H 18 M -5 -5 V 10 M 5 -5 V 10" stroke="#10b981" stroke-width="2" fill="none" />
      <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">2. Collection</text>
    </g>

    <!-- Node 3: Material Extraction -->
    <g transform="translate(-180, 50)">
      <circle cx="0" cy="0" r="40" fill="#ffffff" stroke="#0d9488" stroke-width="3" />
      <!-- Gear shape -->
      <circle cx="0" cy="0" r="15" fill="none" stroke="#0d9488" stroke-width="3" />
      <path d="M 0 -22 V 22 M -22 0 H 22" stroke="#0d9488" stroke-width="3" />
      <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">3. Recovery</text>
    </g>
  </g>

  <!-- Educational Info Cards -->
  <!-- Box 1 -->
  <g transform="translate(80, 780)">
    <rect width="300" height="220" rx="12" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.03))" stroke="#e2e8f0" stroke-width="1" />
    <path d="M 0 12 Q 0 0 12 0 H 288 Q 300 0 300 12 V 45 H 0 Z" fill="#0f766e" />
    <text x="150" y="28" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">TOXIC IMPACTS</text>
    
    <text x="20" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#475569">• Lead leaks into ground soils.</text>
    <text x="20" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#475569">• Mercury contaminates food chains.</text>
    <text x="20" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#475569">• Flame retardants cause toxic air.</text>
    <text x="20" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#475569">• Heavy metals degrade water supply.</text>
  </g>

  <!-- Box 2 -->
  <g transform="translate(420, 780)">
    <rect width="300" height="220" rx="12" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.03))" stroke="#e2e8f0" stroke-width="1" />
    <path d="M 0 12 Q 0 0 12 0 H 288 Q 300 0 300 12 V 45 H 0 Z" fill="#0284c7" />
    <text x="150" y="28" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">RESOURCE SAVINGS</text>
    
    <text x="20" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#475569">• Recovers Gold, Copper &amp; Silver.</text>
    <text x="20" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#475569">• Saves energy spent mining ore.</text>
    <text x="20" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#475569">• Reduces carbon footprint by 70%.</text>
    <text x="20" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#475569">• Supports zero landfill design.</text>
  </g>

  <!-- Footer text -->
  <text x="400" y="1050" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#0d9488" text-anchor="middle">DESIGNED BY YASH PATIL • B.TECH INFORMATION TECHNOLOGY</text>
</svg>
